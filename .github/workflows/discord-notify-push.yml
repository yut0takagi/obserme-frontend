name: Discord Notification - Push

on:
  push:
    branches:
      - '**'  # Trigger on all branches

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Send Discord Notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          AUTHOR_USERNAME: ${{ github.event.head_commit.author.username }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          REPO_URL: ${{ github.event.repository.html_url }}
        run: |
          # Check if Discord webhook URL is configured
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "Warning: DISCORD_WEBHOOK_URL secret is not configured."
            echo "Please add the Discord webhook URL as a repository secret."
            echo "See .github/DISCORD_SETUP.md for setup instructions."
            exit 0
          fi

          # Extract first line of commit message safely
          COMMIT_MESSAGE_FIRST=$(echo "$COMMIT_MESSAGE" | head -n 1)
          # Escape special characters for JSON
          COMMIT_MESSAGE_JSON=$(echo "$COMMIT_MESSAGE_FIRST" | jq -Rs .)
          AUTHOR_NAME_JSON=$(echo "$AUTHOR_NAME" | jq -Rs .)
          BRANCH_NAME_JSON=$(echo "$BRANCH_NAME" | jq -Rs .)
          AUTHOR_URL="https://github.com/${AUTHOR_USERNAME}"

          # Create JSON payload for Discord using jq for safe JSON construction
          jq -n \
            --arg title "📤 Push to ${BRANCH_NAME}" \
            --argjson description "$COMMIT_MESSAGE_JSON" \
            --arg repo "${GITHUB_REPOSITORY}" \
            --arg repo_url "${REPO_URL}" \
            --arg branch "${BRANCH_NAME}" \
            --argjson author "$AUTHOR_NAME_JSON" \
            --arg author_url "${AUTHOR_URL}" \
            --arg commit_url "${COMMIT_URL}" \
            --arg timestamp "${{ github.event.head_commit.timestamp }}" \
            '{
              "embeds": [{
                "title": $title,
                "description": $description,
                "color": 3447003,
                "fields": [
                  {
                    "name": "Repository",
                    "value": "[\($repo)](\($repo_url))",
                    "inline": true
                  },
                  {
                    "name": "Branch",
                    "value": "`\($branch)`",
                    "inline": true
                  },
                  {
                    "name": "Author",
                    "value": "[\($author)](\($author_url))",
                    "inline": true
                  },
                  {
                    "name": "Commit",
                    "value": "[View Commit](\($commit_url))",
                    "inline": false
                  }
                ],
                "timestamp": $timestamp
              }]
            }' > payload.json

          curl -H "Content-Type: application/json" \
            -d @payload.json "${DISCORD_WEBHOOK}"
