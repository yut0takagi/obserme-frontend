name: CI - Pull Request

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr-checks:
    name: PR Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test -- --run

      - name: Build check
        run: npm run build
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY || 'dummy-key-for-build' }}

      - name: Comment PR with test results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const testResults = fs.existsSync('frontend/test-results') 
              ? fs.readdirSync('frontend/test-results').join(', ')
              : 'No test results found';
            
            const jobStatus = '${{ job.status }}';
            const isSuccess = jobStatus === 'success';
            const statusIcon = isSuccess ? '✅' : '❌';
            
            const body = `## CI Results ${statusIcon}
            
            - ${statusIcon} Type check: ${isSuccess ? 'Passed' : 'Failed'}
            - ${statusIcon} Tests: ${isSuccess ? 'Passed' : 'Failed'}
            - ${statusIcon} Build: ${isSuccess ? 'Passed' : 'Failed'}
            
            Test results: ${testResults}`;
            
            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            } catch (error) {
              console.error('Failed to create comment:', error.message);
              // コメント作成に失敗してもCIを失敗させない
            }

