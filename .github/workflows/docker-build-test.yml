name: Docker Build Test

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'frontend/**'
  workflow_dispatch:

jobs:
  docker-build-test:
    name: Docker Build Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build development image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: development
          tags: obserme-frontend:dev-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: false

      - name: Build production image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: production
          tags: obserme-frontend:prod-test
          build-args: |
            GEMINI_API_KEY=dummy-key-for-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: false

      - name: Test Docker Compose
        run: |
          # docker-compose.ymlの構文チェック
          docker-compose config

