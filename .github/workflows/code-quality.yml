name: Code Quality

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    # 毎週月曜日の午前0時（UTC）に実行
    - cron: '0 0 * * 1'

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check for TODO comments
        run: |
          echo "## TODO Comments Found" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if grep -r "#TODO" --include="*.ts" --include="*.tsx" frontend/; then
            echo "⚠️ TODO comments found in code" >> $GITHUB_STEP_SUMMARY
            grep -r "#TODO" --include="*.ts" --include="*.tsx" frontend/ | head -20 >> $GITHUB_STEP_SUMMARY
            exit 0  # TODOコメントは警告のみ
          else
            echo "✅ No TODO comments found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check for console.log statements
        run: |
          echo "## Console.log Statements Found" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          # console.errorとconsole.warnは許可、console.logのみチェック
          if grep -r "console\.log" --include="*.ts" --include="*.tsx" frontend/ --exclude-dir=node_modules --exclude-dir=__tests__; then
            echo "⚠️ console.log statements found (consider removing for production)" >> $GITHUB_STEP_SUMMARY
            grep -r "console\.log" --include="*.ts" --include="*.tsx" frontend/ --exclude-dir=node_modules --exclude-dir=__tests__ | head -10 >> $GITHUB_STEP_SUMMARY
            exit 0  # 警告のみ
          else
            echo "✅ No console.log statements found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check file sizes
        run: |
          echo "## Large Files Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          find frontend -type f -name "*.ts" -o -name "*.tsx" | while read file; do
            size=$(wc -l < "$file")
            if [ $size -gt 500 ]; then
              echo "⚠️ Large file detected: $file ($size lines)" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Check for unused dependencies
        run: |
          echo "## Dependency Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          # depcheckを一時的にインストールして実行
          npx --yes depcheck --ignores="@types/*,vitest,@testing-library/*,jsdom,@vitejs/*" || echo "⚠️ Some unused dependencies may exist" >> $GITHUB_STEP_SUMMARY

